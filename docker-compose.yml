services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kivo-sqlserver
    platform: linux/amd64 # necessário no Apple Silicon (arm64) — roda via emulação
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - kivo-sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  kivo-sqlserver-data:
